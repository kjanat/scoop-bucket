name: CI
on:
  push: { branches: [master] }
  pull_request:
  workflow_dispatch:

permissions: { contents: read }

jobs:
  test:
    name: Scoop bucket tests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: { shell: [powershell, pwsh] }
    defaults: { run: { shell: "${{ matrix.shell }}" } }
    steps:
      # Two commits: in CI the harness validates only the manifests the push changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: scoop-bucket, fetch-depth: 2, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: ScoopInstaller/Scoop, ref: b588a06e41d920d2123ec70aee682bae14935939, path: scoop, persist-credentials: false }
      - uses: potatoqualitee/psmodulecache@9e4b63833c22c1768d648e115a9c849afdda22a5 # v6.3
        with: { modules-to-cache: "BuildHelpers, Pester", shell: "${{ matrix.shell }}" }
      - name: Run Scoop's bucket tests
        run: |
          $env:SCOOP_HOME = Convert-Path '.\scoop'
          $config = New-PesterConfiguration -Hashtable @{
            Run    = @{ Path = '.\scoop-bucket'; PassThru = $true }
            Output = @{ Verbosity = 'Detailed' }
          }
          $result = Invoke-Pester -Configuration $config
          exit $result.FailedCount
